name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: |
            zot.local/tts-frontend:${{ github.sha }}
            zot.local/tts-frontend:prd
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            zot.local/tts-backend:${{ github.sha }}
            zot.local/tts-backend:prd
          cache-from: type=gha
          cache-to: type=gha,mode=min
          
      - name: Deploy
        run: |
            kubectl apply -f backend/k8s.yaml
            kubectl apply -f frontend/k8s.yaml