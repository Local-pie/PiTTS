name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/local-pie/tts-frontend:latest:${{ github.sha }}
            ghcr.io/local-pie/tts-frontend:latest:prd
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/local-pie/tts-backend:latest:${{ github.sha }}
            ghcr.io/local-pie/tts-backend:latest:prd
          cache-from: type=gha
          cache-to: type=gha,mode=min
          
      - name: Deploy
        run: |
            kubectl apply -f backend/k8s.yaml
            kubectl apply -f frontend/k8s.yaml