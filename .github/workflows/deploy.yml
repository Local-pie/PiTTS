name: Build & Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."zot.zot.svc.cluster.local:5000"]
              http = true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: |
            zot.zot.svc.cluster.local:5000/tts-frontend:${{ github.sha }}
            zot.zot.svc.cluster.local:5000/tts-frontend:prd
          cache-from: type=registry,ref=zot.zot.svc.cluster.local:5000/tts-frontend:buildcache
          cache-to: type=registry,ref=zot.zot.svc.cluster.local:5000/tts-frontend:buildcache,mode=max

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            zot.zot.svc.cluster.local:5000/tts-backend:${{ github.sha }}
            zot.zot.svc.cluster.local:5000/tts-backend:prd
          cache-from: type=registry,ref=zot.zot.svc.cluster.local:5000/tts-backend:buildcache
          cache-to: type=registry,ref=zot.zot.svc.cluster.local:5000/tts-backend:buildcache,mode=max
          
      - name: Deploy
        run: |
            kubectl apply -f backend/k8s.yaml
            kubectl apply -f frontend/k8s.yaml